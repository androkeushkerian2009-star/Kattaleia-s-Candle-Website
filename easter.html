<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easter Collection 2026</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #fff0f6, #fff9db);
  overflow-x: hidden;
}

/* HEADER */
.header {
  text-align: center;
  padding: 50px 20px;
}

.header h1 {
  font-size: 40px;
  color: #ff4fa3;
}

.header p {
  font-size: 18px;
  color: #555;
}

/* FLOATING EGGS */
.egg {
  position: fixed;
  font-size: 30px;
  animation: float 6s infinite ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-20px); }
  100% { transform: translateY(0px); }
}

.egg1 { top: 20%; left: 5%; animation-delay: 0s; }
.egg2 { top: 60%; right: 8%; animation-delay: 2s; }
.egg3 { bottom: 10%; left: 15%; animation-delay: 4s; }

/* JUMPING BUNNY */
.bunny {
  position: fixed;
  bottom: 20px;
  right: 20px;
  font-size: 50px;
  animation: jump 1.5s infinite;
}

@keyframes jump {
  0% { transform: translateY(0); }
  50% { transform: translateY(-25px); }
  100% { transform: translateY(0); }
}

/* PRODUCTS GRID */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
  padding: 40px;
}

.product-card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  transition: 0.3s ease;
}

.product-card:hover {
  transform: translateY(-8px);
}

.product-card img {
  width: 100%;
  border-radius: 15px;
}

.product-card h3 {
  color: #ff4fa3;
  margin: 15px 0 5px;
}

.price {
  font-weight: bold;
  margin-bottom: 15px;
}

.order-btn {
  display: inline-block;
  background: linear-gradient(90deg, #ff9ad5, #ffd86b);
  padding: 12px 25px;
  border-radius: 30px;
  text-decoration: none;
  color: black;
  font-weight: bold;
  transition: 0.3s ease;
}

.order-btn:hover {
  transform: scale(1.05);
  opacity: 0.9;
}

/* BACK BUTTON */
.back {
  text-align: center;
  margin: 40px;
}

.back a {
  text-decoration: none;
  color: #555;
  font-weight: bold;
}
</style>
</head>

<body>

<!-- Floating Eggs -->
<div class="egg egg1">🥚</div>
<div class="egg egg2">🥚</div>
<div class="egg egg3">🥚</div>

<!-- Jumping Bunny -->
<div class="bunny">🐰</div>

<!-- Header -->
<div class="header">
  <h1>🐰 Easter Collection 2026 🌸</h1>
  <p>Limited Edition Seasonal Drop — 14 Special Designs!</p>
</div>

<!-- Products -->
<div class="products">

  <!-- 14 PRODUCTS -->

  <!-- Repeat pattern -->
